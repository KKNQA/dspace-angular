# KNQA CI override, layered on top of docker/docker-compose-ci.yml (upstream).
# Applies KNQA backend settings to the throwaway CI backend.
services:
  dspace:
    environment:
      # Same as dspace-backend/dspace/config/local.cfg.knqa-production.EXAMPLE
      user__P__registration: 'false'
      vocabulary__P__plugin__P__knqa_types__P__hierarchy__P__store: 'false'
